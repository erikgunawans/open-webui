# ─────────────────────────────────────────────────────────────────────────────
# Gateway CI — jup-gateway (Bun, TypeScript): typecheck and `bun test`
# Python CI and the frontend's vitest do not cover gateway/ (its tests are
# `*_test.ts` on purpose, so vitest does not collect them).
# ─────────────────────────────────────────────────────────────────────────────
name: Gateway

on:
  push:
    branches: [main, dev]
    paths: ['gateway/**', '.github/workflows/gateway.yaml']
  pull_request:
    branches: [main, dev]
    paths: ['gateway/**', '.github/workflows/gateway.yaml']

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test
