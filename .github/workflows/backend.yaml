# ─────────────────────────────────────────────────────────────────────────────
# Backend CI — pytest suite plus Python formatting checks via Ruff
# Runs on pushes and PRs to main/dev when backend files change
# ─────────────────────────────────────────────────────────────────────────────
name: Python CI

on:
  push:
    branches: [main, dev]
    paths: ['backend/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/backend.yaml']
  pull_request:
    branches: [main, dev]
    paths: ['backend/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/backend.yaml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Ruff format check across supported Python versions ───────────────────
  format-check:
    name: Ruff Format (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install formatter
        run: pip install "ruff>=0.15.5"

      - name: Verify formatting
        run: ruff format --check . --exclude .venv --exclude venv

      - name: Detect logic errors
        run: ruff check --select=F --ignore=F401,F403,F405,F541,F811,F841 --output-format=github .

  # ── Backend test suite ───────────────────────────────────────────────────
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --only-group dev deliberately omits the project and its runtime tree, so
      # this job does not install chromadb/transformers to run the suite.
      - name: Run backend tests
        run: uv run --only-group dev pytest
