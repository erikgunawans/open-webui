# ─────────────────────────────────────────────────────────────────────────────
# Backend CI — pytest suite plus Python formatting checks via Ruff
# Runs on pushes and PRs to main/dev when backend files change
# ─────────────────────────────────────────────────────────────────────────────
name: Python CI

on:
  # Lets a maintainer run the boot baseline by hand straight after an upstream rebase,
  # without having to push a migration to trigger it.
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths: ['backend/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/backend.yaml']
  pull_request:
    branches: [main, dev]
    paths: ['backend/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/backend.yaml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Ruff format check across supported Python versions ───────────────────
  format-check:
    name: Ruff Format (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      # Ruff comes from the lock, not from PyPI's latest. An unpinned install put CI
      # on 0.16.x while the lock pinned 0.15.18, and 0.16 formats python inside
      # fenced markdown blocks: 437 files checked here against 276 locally, so a push
      # could only discover the difference by failing. --frozen is what makes the two
      # agree — bumping the version is now a deliberate `uv lock --upgrade-package ruff`.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Verify formatting
        run: uv run --frozen --only-group dev ruff format --check . --exclude .venv --exclude venv

      - name: Detect logic errors
        run: uv run --frozen --only-group dev ruff check --select=F --ignore=F401,F403,F405,F541,F811,F841 --output-format=github .

  # ── Backend test suite ───────────────────────────────────────────────────
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --only-group dev deliberately omits the project and its runtime tree, so
      # this job does not install chromadb/transformers to run the suite. The boot
      # baseline's alembic head checks run here; its import-the-app test skips, and
      # the `boot` job below is where that one actually executes.
      - name: Run backend tests
        run: uv run --only-group dev pytest

  # ── Runtime suite: boot baseline (#8) and the HTTP seam (#10) ────────────
  # Needs the full runtime (~2 GB: torch, opencv, pyarrow), so it is scoped to the
  # changes it guards rather than run on every backend push. Migrations change on a
  # quarterly rebase (ADR-0007), which is exactly when a revision collision appears
  # and exactly when "the app does not start at all" is the cost of missing it.
  #
  # The portfolio endpoint tests live here for the same reason: importing the router
  # pulls open_webui.config, so they skip in the `--only-group dev` job above. They
  # guard the operating-layer permission, which is the only thing between fifty
  # workspace seats and every gate refusal, so the trigger names the router too.
  boot:
    name: Runtime suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.modified, ','), 'migrations/') ||
      contains(join(github.event.commits.*.added, ','), 'migrations/') ||
      contains(join(github.event.commits.*.modified, ','), 'jup_portfolio') ||
      contains(join(github.event.commits.*.added, ','), 'jup_portfolio')
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install the runtime tree
        run: uv sync --frozen

      - name: Assert the app boots, alembic has one head, and the seam holds
        run: uv run pytest tests/test_boot.py tests/test_jup_portfolio_endpoint.py -v
